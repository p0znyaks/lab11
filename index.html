<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { text-align: center; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 13px; margin-top: 3px; }
        .success { color: green; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <h1>Регистрация</h1>
    <form id="regForm">
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" required>
            <div class="error" id="nameError"></div>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <div class="error" id="emailError"></div>
        </div>
        <div class="form-group">
            <label for="password">Пароль (мин. 6 символов):</label>
            <input type="password" id="password" required minlength="6">
            <div class="error" id="passwordError"></div>
        </div>
        <button type="submit">Зарегистрироваться</button>
        <div id="result"></div>
    </form>
    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
            document.getElementById('result').textContent = '';
            let valid = true;
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!name) { document.getElementById('nameError').textContent = 'Введите имя'; valid = false; }
            if (!email) { document.getElementById('emailError').textContent = 'Введите email'; valid = false; }
            else if (!email.includes('@')) { document.getElementById('emailError').textContent = 'Некорректный email'; valid = false; }
            if (!password) { document.getElementById('passwordError').textContent = 'Введите пароль'; valid = false; }
            else if (password.length < 6) { document.getElementById('passwordError').textContent = 'Пароль должен быть не менее 6 символов'; valid = false; }
            if (valid) {
                document.getElementById('result').textContent = 'Регистрация успешна!';
                document.getElementById('result').className = 'success';
            }
        });
    </script>
</body>
</html>
